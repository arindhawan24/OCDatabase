<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Astheriworlds · OC Database</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff0f5;--card:#fffafc;--ink:#6b3a4e;--soft:#a8738a;--pink:#f4a6c0;--deep:#d9668e;--line:#f2c9d8;--chip:#fde1ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1822;--card:#37212d;--ink:#fbdce8;--soft:#d79ab3;--pink:#c9708f;--deep:#f08db1;--line:#5a3646;--chip:#4a2b3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1822;--card:#37212d;--ink:#fbdce8;--soft:#d79ab3;--pink:#c9708f;--deep:#f08db1;--line:#5a3646;--chip:#4a2b3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:Quicksand,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;margin:0;font-weight:600}
header{text-align:center;padding:22px 12px 8px}
header h1{font-size:2.3rem;color:var(--deep)}
header small{color:var(--soft);letter-spacing:.2em}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
button,input,select,textarea{font:inherit;color:inherit}
.tab,.btn{border:1.5px solid var(--pink);background:var(--card);border-radius:99px;padding:8px 18px;cursor:pointer;color:var(--deep)}
.tab.on,.btn.pri{background:var(--deep);color:#fff;border-color:var(--deep)}
.btn.sm{padding:4px 12px;font-size:.85rem}
main{max-width:1000px;margin:0 auto;padding:0 14px 40px}
.panel{background:var(--card);border:2px dotted var(--pink);border-radius:22px;padding:16px;margin-bottom:16px}
.panel h2{color:var(--deep);margin-bottom:10px;font-size:1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:99px;padding:3px 12px;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--deep);border-color:var(--deep);color:#fff}
.frow{margin-bottom:8px}.frow b{font-size:.8rem;color:var(--soft);display:block;margin-bottom:3px}
.scroll{overflow-x:auto;padding-bottom:6px}
.tree{position:relative;min-width:max-content;padding:6px}
.tree svg{position:absolute;left:0;top:0;pointer-events:none}
.gen{display:flex;justify-content:center;gap:26px;margin-bottom:46px;position:relative}
.gen:last-child{margin-bottom:0}
.node{width:96px;text-align:center;cursor:pointer;position:relative}
.node .av{margin:0 auto 4px}
.node span{font-size:.8rem;display:block;line-height:1.2}
.av{width:64px;height:64px;border-radius:50%;border:3px solid var(--pink);object-fit:cover;background:var(--chip);display:grid;place-items:center;font-family:"Cormorant Garamond",serif;font-size:1.6rem;color:var(--deep);overflow:hidden}
.av.lg{width:110px;height:110px;font-size:3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;text-align:center;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--deep)}
.card .av{margin:0 auto 6px}.card h3{font-size:1.15rem}.card small{color:var(--soft)}
.empty{color:var(--soft);text-align:center;padding:20px}
.ov{position:fixed;inset:0;background:#5b2a3f88;display:grid;place-items:center;padding:14px;z-index:9;overflow:auto}
.modal{background:var(--card);border:2px dotted var(--deep);border-radius:24px;padding:20px;width:min(520px,100%);max-height:92vh;overflow:auto}
label{display:block;font-size:.8rem;color:var(--soft);margin:10px 0 3px}
input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.center{text-align:center}
.x{cursor:pointer;margin-left:4px;opacity:.7}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
</style>
</head>
<body>
<header><small>✿ OC DATABASE ✿</small><h1>🎀 Astheriworlds</h1></header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="m"></div>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function seed(){return{filters:[{id:"f1",name:"Keluarga",options:["Rosewood","Lavelle"]},{id:"f2",name:"Peran",options:["Protagonis","Pendukung"]}],
chars:[{id:"a",name:"Eloise Rosewood",fc:"Face claim: (isi di sini)",bio:"Matriark keluarga Rosewood, suka teh mawar dan renda.",photo:"",attrs:{f1:["Rosewood"],f2:["Pendukung"]},parents:[],spouse:"b"},
{id:"b",name:"Augustin Lavelle",fc:"",bio:"Pelukis istana, lembut dan pemalu.",photo:"",attrs:{f1:["Lavelle"],f2:["Pendukung"]},parents:[],spouse:"a"},
{id:"c",name:"Seraphine",fc:"",bio:"Putri sulung, pemimpi dengan pita merah muda.",photo:"",attrs:{f1:["Rosewood","Lavelle"],f2:["Protagonis"]},parents:["a","b"],spouse:""},
{id:"d",name:"Odette",fc:"",bio:"Adik kecil yang jahil.",photo:"",attrs:{f1:["Rosewood"],f2:["Protagonis"]},parents:["a","b"],spouse:""}]}}
let S;try{S=JSON.parse(localStorage.getItem("ocdb"))}catch(e){}
if(!S||!S.chars)S=seed();
function save(){try{localStorage.setItem("ocdb",JSON.stringify(S))}catch(e){alert("Penyimpanan penuh, coba pakai foto lebih kecil.")}}
let tab="dash",active={},F=null,delArm=false;
const byId=id=>S.chars.find(c=>c.id===id);
const filtered=()=>S.chars.filter(c=>Object.entries(active).every(([f,v])=>!v.length||v.some(x=>(c.attrs[f]||[]).includes(x))));
const av=(c,cls="")=>c.photo?`<img class="av ${cls}" src="${c.photo}" alt="">`:`<div class="av ${cls}">${esc((c.name||"?")[0])}</div>`;
function filterBar(){
 if(!S.filters.length)return"";
 return`<div class="panel"><h2>Filter</h2>${S.filters.map(f=>`<div class="frow"><b>${esc(f.name)}</b><div class="chips">${f.options.map(o=>`<span class="chip ${(active[f.id]||[]).includes(o)?"on":""}" onclick="tog('${f.id}',this.dataset.o)" data-o="${esc(o)}">${esc(o)}</span>`).join("")||"<small>belum ada opsi</small>"}</div></div>`).join("")}<button class="btn sm" onclick="active={};render()">Reset filter</button></div>`}
function tog(f,o){const a=active[f]=active[f]||[];const i=a.indexOf(o);i<0?a.push(o):a.splice(i,1);render()}
function render(){
 $("#nav").innerHTML=[["dash","🌸 Dashboard"],["char","🎀 Character"],["filt","✿ Filter"]].map(([k,l])=>`<button class="tab ${tab===k?"on":""}" onclick="tab='${k}';render()">${l}</button>`).join("");
 $("#app").innerHTML=tab==="dash"?dash():tab==="char"?chars():filt();
 if(tab==="dash")requestAnimationFrame(lines)}
function members(list){return list.length?`<div class="grid">${list.map(c=>`<div class="card" onclick="show('${c.id}')">${av(c)}<h3>${esc(c.name)}</h3><small>${esc(c.fc)}</small></div>`).join("")}</div>`:`<div class="empty">Belum ada karakter yang cocok 🎀</div>`}
function dash(){
 const vis=filtered(),ids=new Set(vis.map(c=>c.id)),g={};
 vis.forEach(c=>g[c.id]=0);
 for(let k=0;k<8;k++)vis.forEach(c=>{const p=c.parents.filter(x=>ids.has(x));if(p.length)g[c.id]=Math.max(g[c.id],1+Math.max(...p.map(x=>g[x])));const s=c.spouse;if(s&&ids.has(s)){const m=Math.max(g[c.id],g[s]);g[c.id]=g[s]=m}});
 const max=vis.length?Math.max(...Object.values(g)):-1,rows=[];
 for(let i=0;i<=max;i++){const r=[],used=new Set();vis.filter(c=>g[c.id]===i).forEach(c=>{if(used.has(c.id))return;used.add(c.id);r.push(c);if(c.spouse&&ids.has(c.spouse)&&!used.has(c.spouse)){used.add(c.spouse);r.push(byId(c.spouse))}});rows.push(r)}
 const tree=vis.length?`<div class="scroll"><div class="tree" id="tree">${rows.map(r=>`<div class="gen">${r.map(c=>`<div class="node" id="n${c.id}" onclick="show('${c.id}')">${av(c)}<span>${esc(c.name)}</span></div>`).join("")}</div>`).join("")}<svg id="svg"></svg></div></div>`:`<div class="empty">Tidak ada karakter. Tambah di tab Character ✿</div>`;
 return filterBar()+`<div class="panel"><h2>Family Tree</h2>${tree}</div><div class="panel"><h2>Anggota Keluarga (${vis.length})</h2>${members(vis)}</div>`}
function lines(){
 const t=$("#tree"),s=$("#svg");if(!t||!s)return;
 const tr=t.getBoundingClientRect();s.setAttribute("width",t.scrollWidth);s.setAttribute("height",t.scrollHeight);
 let d="";const pt=(el,top)=>{const r=el.getBoundingClientRect();return[r.left-tr.left+r.width/2,(top?r.top:r.top+66)-tr.top]};
 filtered().forEach(c=>{const el=$("#n"+c.id);if(!el)return;
  c.parents.forEach(p=>{const pe=$("#n"+p);if(!pe)return;const[a,b]=pt(pe,0),[x,y]=pt(el,1);d+=`<path d="M${a} ${b+20}C${a} ${(b+y)/2+10},${x} ${(b+y)/2},${x} ${y}" />`});
  if(c.spouse&&c.id<c.spouse){const se=$("#n"+c.spouse);if(se){const[a,b]=pt(el,1),[x]=pt(se,1);d+=`<path d="M${a+14} ${b+32}L${x-14} ${b+32}" stroke-dasharray="3 4"/>`}}});
 s.innerHTML=`<g fill="none" stroke="#e58aab" stroke-width="2" stroke-linecap="round">${d}</g>`}
function chars(){return filterBar()+`<div class="panel"><div class="fl"><h2>Semua Karakter (${filtered().length})</h2><button class="btn pri" onclick="edit()">+ Karakter baru</button></div>${members(filtered())}</div>`}
function filt(){
 return`<div class="panel"><h2>Buat Filter Baru</h2><label>Nama filter (mis. Kota, Elemen, Usia)</label><input type="text" id="nf"><label>Opsi, pisahkan dengan koma</label><input type="text" id="no" placeholder="Kerajaan, Desa, Kota"><div class="row"><button class="btn pri" onclick="addFilter()">Simpan filter</button></div></div>`+
 S.filters.map(f=>`<div class="panel"><div class="fl"><h2>${esc(f.name)}</h2><button class="btn sm" onclick="delFilter('${f.id}')">Hapus filter</button></div><div class="chips">${f.options.map(o=>`<span class="chip">${esc(o)}<span class="x" onclick="delOpt('${f.id}',this.dataset.o)" data-o="${esc(o)}">×</span></span>`).join("")}</div><div class="row"><input type="text" id="o${f.id}" placeholder="Opsi baru" style="max-width:220px"><button class="btn sm" onclick="addOpt('${f.id}')">Tambah</button></div></div>`).join("")}
function addFilter(){const n=$("#nf").value.trim();if(!n)return;S.filters.push({id:uid(),name:n,options:[...new Set($("#no").value.split(",").map(x=>x.trim()).filter(Boolean))]});save();render()}
function addOpt(id){const v=$("#o"+id).value.trim(),f=S.filters.find(x=>x.id===id);if(v&&!f.options.includes(v))f.options.push(v);save();render()}
function delOpt(id,o){const f=S.filters.find(x=>x.id===id);f.options=f.options.filter(x=>x!==o);S.chars.forEach(c=>{if(c.attrs[id])c.attrs[id]=c.attrs[id].filter(x=>x!==o)});if(active[id])active[id]=active[id].filter(x=>x!==o);save();render()}
function delFilter(id){S.filters=S.filters.filter(f=>f.id!==id);delete active[id];S.chars.forEach(c=>delete c.attrs[id]);save();render()}
function modal(h){$("#m").innerHTML=h?`<div class="ov" onclick="if(event.target===this)modal()"><div class="modal">${h}</div></div>`:""}
function show(id){
 const c=byId(id);if(!c)return;delArm=false;
 const ids=new Set(filtered().map(x=>x.id)),ok=x=>x&&ids.has(x.id);
 const par=c.parents.map(byId).filter(ok),kids=S.chars.filter(x=>x.parents.includes(id)&&ids.has(x.id)),sp=ok(byId(c.spouse))?[byId(c.spouse)]:[];
 const sib=S.chars.filter(x=>x.id!==id&&ids.has(x.id)&&x.parents.some(p=>c.parents.includes(p)));
 const grp=(t,l)=>l.length?`<label>${t}</label><div class="chips">${l.map(x=>`<span class="chip" onclick="show('${x.id}')">${esc(x.name)}</span>`).join("")}</div>`:"";
 const rel=grp("Orang tua",par)+grp("Pasangan",sp)+grp("Saudara",sib)+grp("Anak",kids);
 modal(`<div class="center">${av(c,"lg")}<h2 style="margin-top:8px">${esc(c.name)}</h2><small style="color:var(--soft)">${esc(c.fc)}</small></div>
 <label>Tentang</label><div>${esc(c.bio)||"-"}</div>
 ${S.filters.map(f=>(c.attrs[f.id]||[]).length?`<label>${esc(f.name)}</label><div class="chips">${c.attrs[f.id].map(o=>`<span class="chip">${esc(o)}</span>`).join("")}</div>`:"").join("")}
 <label>Terhubung (sesuai filter aktif)</label>${rel||'<div style="color:var(--soft)">Tidak ada yang cocok filter.</div>'}
 <div class="row"><button class="btn pri" onclick="edit('${id}')">Edit</button><button class="btn" id="db" onclick="delChar('${id}')">Hapus</button><button class="btn" onclick="modal()">Tutup</button></div>`)}
function delChar(id){if(!delArm){delArm=true;$("#db").textContent="Yakin hapus?";return}
 S.chars=S.chars.filter(c=>c.id!==id);S.chars.forEach(c=>{c.parents=c.parents.filter(p=>p!==id);if(c.spouse===id)c.spouse=""});save();modal();render()}
function edit(id){const c=id?byId(id):null;F=c?JSON.parse(JSON.stringify(c)):{id:uid(),name:"",fc:"",bio:"",photo:"",attrs:{},parents:[],spouse:"",isNew:true};form()}
function sync(){if(!$("#fn"))return;F.name=$("#fn").value;F.fc=$("#ff").value;F.bio=$("#fb").value;F.spouse=$("#fs").value}
function form(){
 const others=S.chars.filter(c=>c.id!==F.id);
 modal(`<h2>${F.isNew?"Karakter baru":"Edit karakter"}</h2>
 <div class="center" style="margin-top:10px">${av(F,"lg")}<br><input type="file" id="fp" accept="image/*" style="display:none" onchange="photo(this.files[0])"><button class="btn sm" style="margin-top:8px" onclick="$('#fp').click()">Unggah foto</button></div>
 <label>Nama</label><input type="text" id="fn" value="${esc(F.name)}">
 <label>Face claim</label><input type="text" id="ff" value="${esc(F.fc)}">
 <label>Tentang / biodata</label><textarea id="fb">${esc(F.bio)}</textarea>
 ${S.filters.map(f=>`<label>${esc(f.name)}</label><div class="chips">${f.options.map(o=>`<span class="chip ${(F.attrs[f.id]||[]).includes(o)?"on":""}" data-f="${f.id}" data-o="${esc(o)}" onclick="fa(this)">${esc(o)}</span>`).join("")||"<small>buat opsi di tab Filter</small>"}</div>`).join("")}
 <label>Orang tua</label><div class="chips">${others.map(o=>`<span class="chip ${F.parents.includes(o.id)?"on":""}" onclick="fp('${o.id}')">${esc(o.name)}</span>`).join("")||"<small>belum ada karakter lain</small>"}</div>
 <label>Pasangan</label><select id="fs"><option value="">-</option>${others.map(o=>`<option value="${o.id}" ${F.spouse===o.id?"selected":""}>${esc(o.name)}</option>`).join("")}</select>
 <div class="row"><button class="btn pri" onclick="saveChar()">Simpan</button><button class="btn" onclick="modal()">Batal</button></div>`)}
function fa(el){sync();const f=el.dataset.f,o=el.dataset.o,a=F.attrs[f]=F.attrs[f]||[],i=a.indexOf(o);i<0?a.push(o):a.splice(i,1);form()}
function fp(id){sync();const i=F.parents.indexOf(id);i<0?F.parents.push(id):F.parents.splice(i,1);form()}
function photo(file){if(!file)return;sync();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);F.photo=cv.toDataURL("image/jpeg",.8);form()};im.src=r.result};r.readAsDataURL(file)}
function saveChar(){sync();if(!F.name.trim()){$("#fn").focus();return}
 const{isNew,...c}=F;c.name=c.name.trim();
 const i=S.chars.findIndex(x=>x.id===c.id);i<0?S.chars.push(c):S.chars[i]=c;
 if(c.spouse){const s=byId(c.spouse);if(s)s.spouse=c.id}
 S.chars.forEach(x=>{if(x.spouse===c.id&&c.spouse!==x.id)x.spouse=""});
 save();modal();render();show(c.id)}
window.addEventListener("resize",()=>tab==="dash"&&lines());
render();
</script>
</body>
</html>
